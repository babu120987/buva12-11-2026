name: buva-shop

services:
  # ---------- Tier 3: Data ----------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buva
      POSTGRES_DB: buva
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - buva_db:/var/lib/postgresql/data
      # First start only: restores the 22 Aug 2026 DR backup, then applies migrations 001-008
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buva -d buva"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  # ---------- Tier 2: Application (your existing BUVA API) ----------
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 9000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: buva
      DB_USER: buva
    volumes:
      - buva_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  # ---------- Tier 1: Presentation ----------
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-9090}:80"
    depends_on:
      - api
    networks: [frontend]

networks:
  frontend:
  backend:

volumes:
  buva_db:
  buva_uploads:
