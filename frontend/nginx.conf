# BUVA web tier
# Old hostname: send visitors (and Google) to the main domain, keeping the path.
server {
    listen 80;
    listen [::]:80;
    server_name bhuva.duckdns.org www.buva.shop;
    return 301 https://buva.shop$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;            # admin product image uploads
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ---- application tier ----
    location ^~ /api/ {
        proxy_pass         http://api:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass http://api:9000/health; }

    # images uploaded from the admin panel live in the API container's volume
    location ^~ /uploads/ {
        proxy_pass http://api:9000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- old pages -> sections of the new single-page store ----
    location = /about.html       { return 301 /#story; }
    location = /contact.html     { return 301 /#contact; }
    location = /service.html     { return 301 /#shop; }
    location = /team.html        { return 301 /#story; }
    location = /testimonial.html { return 301 /#shop; }
    location = /product.html {
        if ($arg_slug) { return 301 /?product=$arg_slug; }
        return 301 /#shop;
    }

    # ---- static ----
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /admin/ { add_header Cache-Control "no-store"; try_files $uri $uri/ /admin/index.html; }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
