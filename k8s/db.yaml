# Tier 3 — PostgreSQL (restores the DR backup on first start)
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: buva
spec:
  selector: { app: buva-db }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buva-db
  namespace: buva
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: { app: buva-db }
  template:
    metadata:
      labels: { app: buva-db }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: postgres
          image: ghcr.io/babu120987/buva-shop-db:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: buva
            - name: POSTGRES_DB
              value: buva
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: buva-secrets, key: DB_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "buva", "-d", "buva"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "buva", "-d", "buva"] }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
