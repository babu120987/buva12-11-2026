# Tier 1 — Nginx storefront, /admin, invoice pages; proxies /api and /uploads to the "api" Service
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: buva
spec:
  selector: { app: buva-web }
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buva-web
  namespace: buva
spec:
  replicas: 2
  selector:
    matchLabels: { app: buva-web }
  template:
    metadata:
      labels: { app: buva-web }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/babu120987/buva12-11-2026-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
