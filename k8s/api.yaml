# Tier 2 — BUVA API (Node/Express)
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: buva
spec:
  selector: { app: buva-api }
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
# Product images uploaded from /admin are stored here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buva-uploads
  namespace: buva
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buva-api
  namespace: buva
spec:
  # 1 replica: the uploads volume is ReadWriteOnce (local-path). Use RWX storage to scale out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: buva-api }
  template:
    metadata:
      labels: { app: buva-api }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000          # "node" user in node:22-alpine
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo waiting for database; sleep 2; done"]
      containers:
        - name: api
          image: ghcr.io/babu120987/buva12-11-2026-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef: { name: buva-config }
            - secretRef: { name: buva-secrets }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /health, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: buva-uploads
